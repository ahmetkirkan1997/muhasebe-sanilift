<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sanilift Muhasebe</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><meta name="theme-color" content="#0b0b0b"></head><body><title>Sanilift Muhasebe</title>
<style>
:root{--bg:#0a0a0a;--card:#151515;--card2:#1d1d1d;--line:#2a2a2a;--tx:#f4f4f4;--mut:#9a9a9a;--o:#ff7a00;--y:#ffc400;--red:#ff4d4d;--green:#2ee59d;--grad:linear-gradient(135deg,#ff7a00,#ffc400);color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(circle at 80% -10%,#2a1700 0,#0a0a0a 45%);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;padding-bottom:80px}
h1,h2,h3{font-weight:700}
.logo{font-size:20px;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.5px}
nav{position:fixed;bottom:0;left:0;right:0;background:#0f0f0fee;backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;z-index:50;padding-bottom:env(safe-area-inset-bottom)}
nav a{flex:1;min-width:0;text-align:center;padding:10px 1px;color:var(--mut);text-decoration:none;font-size:10px;display:flex;flex-direction:column;gap:3px;align-items:center}
nav a span{font-size:20px}
nav a.on{color:var(--y)}
nav .logo{display:none}
main{max-width:1100px;margin:0 auto;padding:16px}
@media(min-width:900px){
 body{padding-bottom:0;padding-left:210px}
 nav{top:0;bottom:auto;width:210px;right:auto;height:100vh;flex-direction:column;border-top:0;border-right:1px solid var(--line);padding:18px 10px}
 nav .logo{display:block;margin:4px 10px 22px;font-size:22px}
 nav a{flex:none;flex-direction:row;font-size:15px;gap:12px;padding:12px 14px;border-radius:12px;justify-content:flex-start}
 nav a.on{background:#ffffff0d}
}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.top h2{font-size:22px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
@media(max-width:520px){.g2{grid-template-columns:1fr 1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.stat{position:relative;overflow:hidden}
.stat small{color:var(--mut);font-size:12px;display:block;margin-bottom:6px}
.stat b{font-size:20px;word-break:break-word}
.stat.hero{background:linear-gradient(135deg,#ff7a0033,#ffc40014);border-color:#ff7a0066}
.red{color:var(--red)}.green{color:var(--green)}.yel{color:var(--y)}
.stat.red-b{border-color:#ff4d4d88;background:#ff4d4d12}
.stat.green-b{border-color:#2ee59d88;background:#2ee59d12}
.btn{background:var(--grad);color:#111;border:0;padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--line)}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:9px}
.btn.dng{background:#ff4d4d22;color:var(--red);border:1px solid #ff4d4d55}
.btn:active{transform:scale(.97)}
.dosyabtn{position:relative;display:inline-block;overflow:hidden;line-height:1.2}
.dosyabtn input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:100px;padding:0;border:0}
.btn:focus-visible,nav a:focus-visible{outline:2px solid var(--y);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end;margin-top:12px}
input,select,textarea{width:100%;background:#0d0d0d;border:1px solid var(--line);color:var(--tx);padding:11px 12px;border-radius:11px;font-size:15px;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--o);box-shadow:0 0 0 3px #ff7a0033}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
.tw{overflow-x:auto;border-radius:12px;border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:560px}
th{background:#1a1a1a;color:var(--y);text-align:left;padding:10px;font-weight:600;white-space:nowrap}
td{padding:10px;border-top:1px solid var(--line);white-space:nowrap}
tr.tot td{background:#1a1a1a;font-weight:700}
tr.gunbos>td{height:6px;padding:0;border:0;background:#1a1a1a}
.r{text-align:right}
.cari{display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;transition:.15s}
.cari:hover{border-color:var(--o)}
.cari h3{font-size:16px}
.cari small{color:var(--mut)}
.tag{display:inline-block;font-size:11px;padding:3px 8px;border-radius:20px;font-weight:600}
.t-alis{background:#ff4d4d22;color:var(--red)}.t-satis{background:#2ee59d22;color:var(--green)}
.t-devira,.t-devirk{background:#ffffff18;color:var(--tx)}.t-odeme{background:#ffc40022;color:var(--y)}.t-tahsilat{background:#ff7a0022;color:var(--o)}
.kdvt{width:100%;border-collapse:collapse;font-size:12.5px}.kdvt th,.kdvt td{padding:7px 6px;border-bottom:1px solid #ffffff18;text-align:left;white-space:nowrap}.kdvt .r{text-align:right}.kdvt th{color:var(--mut);font-weight:600}
.stat.warn{border-color:#ffc40099;background:#ffc40014}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
#modal{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;justify-content:center;z-index:100;padding:0}
#modal.open{display:flex}
#modal .box{background:var(--card);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px;border:1px solid var(--line)}
@media(min-width:700px){#modal{align-items:center;padding:20px}#modal .box{border-radius:20px}}
.prev{margin-top:12px;padding:12px;border-radius:10px;background:#ff7a0018;color:var(--mut);font-weight:600;text-align:left}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tabs button{background:var(--card);border:1px solid var(--line);color:var(--mut);padding:8px 14px;border-radius:20px;cursor:pointer;font-size:13px}
.tabs button.on{background:var(--grad);color:#111;border-color:transparent;font-weight:700}
/* Teklif */
.paper{background:#fff;color:#111;border-radius:12px;padding:22px;font-size:13px;overflow-x:auto;min-width:0}
@media(max-width:600px){.paper{padding:14px;font-size:12px}.paper th,.paper td{padding:6px 5px}}
.paper h2{color:#ff7a00;font-size:22px}
.paper table{min-width:0;color:#111}
.paper th{background:#111;color:#ffc400}
.paper td{border-top:1px solid #ddd}
.paper .tt{margin-left:auto;width:240px;margin-top:12px}
.paper .tt div{display:flex;justify-content:space-between;padding:4px 0}
.paper .tt .g{border-top:2px solid #ff7a00;font-weight:800;font-size:15px;margin-top:4px;padding-top:6px}
.items .it{display:grid;grid-template-columns:2fr .7fr 1fr auto;gap:6px;margin-bottom:6px}
#kilit{position:fixed;inset:0;z-index:90;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}#kilit .gbox{width:100%;max-width:400px;margin:auto}
.logoplate{background:#fff;border-radius:14px;padding:8px 14px;display:flex;justify-content:center;align-items:center}.logoplate img{display:block;height:auto}#kilit .logoplate{margin-bottom:12px}#kilit .logoplate img{width:240px;max-width:100%}nav .logo .logoplate{padding:6px 8px}nav .logo .logoplate img{width:100%}.panellogo{width:fit-content;max-width:100%;margin-bottom:12px}.panellogo img{height:54px;width:auto}
.kasaikon{width:24px;height:24px;display:block}nav a span .kasaikon{margin:0 auto}.kasaikon-b{display:inline-flex;vertical-align:-4px;color:var(--y)}.kasaikon-b .kasaikon{width:30px;height:30px}.kasaikon.kucuk{display:inline-block;width:16px;height:16px;vertical-align:-3px}
mark{background:#ffc40040;color:var(--y);border-radius:3px;padding:0 1px}
.flash,.flash>td{animation:flashy 2.4s ease-out}
@keyframes flashy{0%,45%{background:#ffc40066}100%{background:transparent}}
.ara-g{margin-top:12px}.ara-g h4{font-size:12px;color:var(--mut);letter-spacing:.3px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.ara-r{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:12px;margin-bottom:6px;cursor:pointer;background:var(--card2)}
.ara-r:hover{border-color:var(--o)}.ara-r b{font-size:14px;overflow-wrap:anywhere}.ara-r small{display:block;color:var(--mut);margin-top:2px;overflow-wrap:anywhere;line-height:1.4}
.ara-t{white-space:nowrap;font-weight:700;font-size:14px}
</style>

<script>
const $=s=>document.querySelector(s);
const KEY='muhasebe_pro_v1';
const DEF=()=>({cariler:[],hareketler:[],cekler:[],kasa:[],teklifler:[],kullanicilar:[],notlar:[],belgeler:[],ayar:{kdv:20,firma:'',vdairesi:'',vergi:'',tel:'',eposta:'',adres:''}});
let db=DEF();
let uyari=false;
let dirty=false;
function toast(msg,ms=2200){let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';t.style.cssText='position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;border:1px solid #ff7a00;padding:10px 16px;border-radius:12px;z-index:200;font-size:14px;max-width:90vw;text-align:center';document.body.appendChild(t)}t.textContent=msg;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',ms)}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>new Date().toLocaleDateString('sv-SE');
const _nf=new Intl.NumberFormat('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmt=n=>'₺'+_nf.format(Math.round((+n||0)*100)/100);
/* ---- Canlı para alanı: yazarken ₺1.234,50 biçiminde görünür ---- */
const paraAlan=el=>el&&el.dataset&&el.dataset.para==='1';
function paraGrup(i){return (i||'0').replace(/^0+(?=\d)/,'').replace(/\B(?=(\d{3})+(?!\d))/g,'.')}
function paraCiz(el){
 const ds=el._d==null?'':el._d,txt='₺'+paraGrup(el._i)+','+(ds+'00').slice(0,2);
 el.value=txt;const pos=el._d==null?txt.length-3:txt.length-2+ds.length;
 try{el.setSelectionRange(pos,pos)}catch(e){}
}
function paraAyarla(el,n){const v=Math.round((+n||0)*100)/100,t=v.toFixed(2).split('.');el._i=t[0]==='0'?'':t[0];el._d=null;el.dataset.para='1';el.value='₺'+paraGrup(el._i)+','+t[1];if(el._i==='')el.value='₺0,'+t[1]}
function paraOku(el){if(!paraAlan(el))return parseFloat(String(el.value).replace(',','.'))||0;return +((el._i||'0')+'.'+(((el._d||'')+'00').slice(0,2)))}
function paraMetin(el,t){ /* yapıştırma / klavye dışı giriş: metni çöz */
 t=String(t).replace(/[₺\sTLtl]/g,'');let ip=t,dp=null;
 const k=t.lastIndexOf(',');
 if(k>=0){ip=t.slice(0,k);dp=t.slice(k+1)}
 else{const n=t.lastIndexOf('.');if(n>=0&&t.length-n-1>=1&&t.length-n-1<=2){ip=t.slice(0,n);dp=t.slice(n+1)}}
 el._i=ip.replace(/\D/g,'').replace(/^0+/,'');el._d=dp==null?null:dp.replace(/\D/g,'').slice(0,2);paraCiz(el);
}
document.addEventListener('beforeinput',e=>{
 const el=e.target;if(!paraAlan(el))return;
 const t=e.inputType,d=e.data;
 if(el.selectionStart===0&&el.selectionEnd===el.value.length&&el.value.length>0&&(t==='insertText'||t==='deleteContentBackward'||t==='deleteContentForward')){el._i='';el._d=null}
 if(t==='insertText'&&d!=null&&!e.isComposing){
  e.preventDefault();
  for(const ch of d){
   if(/\d/.test(ch)){if(el._d==null){if((el._i||'').length<12)el._i=(el._i||'')+ch}else if(el._d.length<2)el._d+=ch}
   else if(ch===','||ch==='.'){if(el._d==null)el._d=''}
  }
  paraCiz(el);el.dispatchEvent(new Event('input',{bubbles:true}));
 }else if(t==='deleteContentBackward'||t==='deleteContentForward'){
  e.preventDefault();
  if(el._d!=null){if(el._d.length)el._d=el._d.slice(0,-1);else el._d=null}else el._i=(el._i||'').slice(0,-1);
  paraCiz(el);el.dispatchEvent(new Event('input',{bubbles:true}));
 }else if(t==='insertFromPaste'){
  e.preventDefault();const tx=(e.clipboardData&&e.clipboardData.getData('text'))||e.data||'';paraMetin(el,tx);el.dispatchEvent(new Event('input',{bubbles:true}));
 }
});
document.addEventListener('input',e=>{ /* beforeinput desteklenmeyen/bestelenmiş girişler için yedek */
 const el=e.target;if(!paraAlan(el))return;
 if(el.value!==('₺'+paraGrup(el._i)+','+(((el._d==null?'':el._d)+'00').slice(0,2)))){paraMetin(el,el.value);el.dispatchEvent(new Event('input',{bubbles:true}))}
});
document.addEventListener('focusin',e=>{const el=e.target;if(paraAlan(el)){setTimeout(()=>paraCiz(el),0)}});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fd=d=>d?d.split('-').reverse().join('.'):'-';
const tot=h=>h.tutar!=null?h.tutar:+(h.adet*h.birim*(1+h.kdv/100)).toFixed(2);
const cariAd=id=>(db.cariler.find(c=>c.id===id)||{ad:'—'}).ad;
const buYil=()=>new Date().getFullYear();
const cariEtiket=c=>c.ad+(c.yil?' ('+c.yil+')':'');
function yilDoldur(){let d=false;db.cariler.forEach(c=>{if(!c.yil){const ys=db.hareketler.filter(h=>h.cariId===c.id).map(h=>String(h.tarih||'').slice(0,4)).concat(db.cekler.filter(x=>x.cariId===c.id).map(x=>String(x.tarih||'').slice(0,4))).filter(y=>/^\d{4}$/.test(y)).sort();c.yil=ys.length?+ys[0]:buYil();d=true}});return d}
const clr=n=>n<0?'red':'green';

/* ---------- Hesaplar ---------- */
function bakiye(id){
 let satis=0,alis=0,tah=0,ode=0;
 db.hareketler.filter(h=>h.cariId===id).forEach(h=>{const t=tot(h);
  if(h.tip==='satis')satis+=t;else if(h.tip==='alis')alis+=t;else if(h.tip==='tahsilat')tah+=t;else if(h.tip==='devira'){if(h.yon==='verecek')alis+=t;else satis+=t}else if(h.tip==='devirk'){if(h.yon==='verecek')ode+=t;else tah+=t}else ode+=t});
 db.cekler.filter(c=>c.cariId===id&&c.durum!=='odenmedi').forEach(c=>{if(c.yon==='alacak')tah+=c.tutar;else ode+=c.tutar});
 const a0=satis-tah,v0=alis-ode;
 /* fazla ödeme/tahsilat karşı tarafa taşınır: eksi alacak/verecek gösterilmez (net değişmez) */
 const fazlaOde=Math.max(-v0,0),fazlaTah=Math.max(-a0,0);
 const alacak=Math.max(a0,0)+fazlaOde,verecek=Math.max(v0,0)+fazlaTah;
 return{satis,alis,tah,ode,alacak,verecek,fazlaOde,fazlaTah,net:a0-v0};
}
function genel(){
 let alacak=0,verecek=0;
 db.cariler.forEach(c=>{const b=bakiye(c.id);alacak+=b.alacak;verecek+=b.verecek});
 return{alacak,verecek,net:alacak-verecek};
}
function cekToplam(){
 const t={alacak:0,verecek:0};
 db.cekler.filter(c=>c.durum==='bekliyor').forEach(c=>t[c.yon]+=c.tutar);
 return t;
}
/* ---------- Kredi kartı taksitleri ---------- */
function ayEkle(d,k){const p=String(d).split('-').map(Number);if(p.length<3||!p[0])return d;const t=new Date(p[0],p[1]-1+k,1),son=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();t.setDate(Math.min(p[2],son));return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0')}
function taksitPlan(tutar,t,tarih){ /* [{t:vade,tutar}] */
 const n=t&&t.n>1?t.n:1;if(n===1)return [{t:tarih,tutar}];
 const ilk=t.ilk||ayEkle(tarih,1),taban=Math.floor(tutar/n*100)/100,out=[];
 for(let i=0;i<n;i++)out.push({t:ayEkle(ilk,i),tutar:i===n-1?Math.round((tutar-taban*(n-1))*100)/100:taban});
 return out;
}
/* hazineye işlenen tutar: taksitli ise yalnızca vadesi gelen taksitler */
function nakitSay(rec,tutar){if(!rec.taksit||!(rec.taksit.n>1))return tutar;const b=today();return Math.round(taksitPlan(tutar,rec.taksit,rec.tarih).filter(p=>p.t<=b).reduce((a,p)=>a+p.tutar,0)*100)/100}
function taksitBekleyen(){
 const b=today(),L=[];
 db.hareketler.filter(h=>h.taksit&&h.taksit.n>1&&(h.tip==='tahsilat'||h.tip==='odeme')).forEach(h=>taksitPlan(tot(h),h.taksit,h.tarih).forEach((p,i,a)=>{if(p.t>b)L.push({t:p.t,tutar:p.tutar,yon:h.tip==='tahsilat'?'giris':'cikis',sira:(i+1)+'/'+a.length,ad:(db.cariler.find(c=>c.id===h.cariId)||{}).ad||'',not:h.aciklama||'',kart:h.kart||''})}));
 db.kasa.filter(k=>k.taksit&&k.taksit.n>1).forEach(k=>taksitPlan(k.tutar,k.taksit,k.tarih).forEach((p,i,a)=>{if(p.t>b)L.push({t:p.t,tutar:p.tutar,yon:k.yon,sira:(i+1)+'/'+a.length,ad:'',not:[k.kisi,k.aciklama].filter(Boolean).join(' · '),kart:k.kart||''})}));
 L.sort((a,b)=>a.t.localeCompare(b.t));
 return{liste:L,giris:L.filter(x=>x.yon==='giris').reduce((a,x)=>a+x.tutar,0),cikis:L.filter(x=>x.yon==='cikis').reduce((a,x)=>a+x.tutar,0)};
}
const taksitSecenek=[['1','Peşin (tek çekim)'],...Array.from({length:11},(_,i)=>[String(i+2),(i+2)+' taksit'])];
function taksitAlan(o,tarih){const n=parseInt(o.taksit)||1;if(n<2)return null;if(o.ilk&&o.ilk<tarih)throw new Error('İlk taksit tarihi işlem tarihinden önce olamaz');return{n,ilk:o.ilk||ayEkle(tarih,1)}}

/* Veriler AES-256-GCM ile şifrelenir. Veri anahtarı her kullanıcının şifresinden (PBKDF2-SHA256) türetilen anahtarla ayrı ayrı sarılır. */
const KEY2='muhasebe_pro_v2',ITER=600000,ENC=new TextEncoder(),DEC=new TextDecoder();
let ENV=null,DEK=null,OTURUM=null,yazSira=Promise.resolve(),bostaT=null,BOSTA_MS=15*60*1000,yanlis=0,kilitBit=0;
const u8b=a=>{let s='';for(let i=0;i<a.length;i+=8192)s+=String.fromCharCode.apply(null,a.subarray(i,i+8192));return btoa(s)};
const b8u=b=>{const s=atob(b),a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a};
const rnd=n=>crypto.getRandomValues(new Uint8Array(n));
const kadi=s=>String(s||'').trim().normalize('NFC').replace(/[İı]/g,'i').toLowerCase();
const kadiGecerli=s=>/^[\p{L}\p{N}._-]{3,32}$/u.test(String(s||'').trim());
async function kek(pw,salt,it){const m=await crypto.subtle.importKey('raw',ENC.encode(String(pw).normalize('NFC')),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:it,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function sar(raw,pw){const salt=rnd(16),iv=rnd(12),k=await kek(pw,salt,ITER);const w=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,raw);return{salt:u8b(salt),it:ITER,iv:u8b(iv),w:u8b(new Uint8Array(w))}}
async function sarAc(e,pw){const k=await kek(pw,b8u(e.salt),e.it);return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:b8u(e.iv)},k,b8u(e.w)))}
const dekIce=raw=>crypto.subtle.importKey('raw',raw,'AES-GCM',true,['encrypt','decrypt']);
async function veriSifrele(obj,key){const iv=rnd(12);const c=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,ENC.encode(JSON.stringify(obj)));return{iv:u8b(iv),d:u8b(new Uint8Array(c))}}
async function veriAc(env,key){return JSON.parse(DEC.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b8u(env.iv)},key,b8u(env.d))))}
function zarfMi(o){return !!(o&&o.sifreli===true&&Array.isArray(o.k)&&o.k.length&&typeof o.iv==='string'&&typeof o.d==='string')}
function kayitliZarf(){try{const o=JSON.parse(lsGet(KEY2));return zarfMi(o)?o:null}catch(e){return null}}
async function zarfAc(env,ad,pw){
 const u=kadi(ad),e=env.k.find(x=>x.u===u);
 if(!e){try{await kek('x',rnd(16),ITER)}catch(x){}throw new Error('giris')}
 let raw;try{raw=await sarAc(e,pw)}catch(x){throw new Error('giris')}
 const dek=await dekIce(raw);let d;try{d=await veriAc(env,dek)}catch(x){throw new Error('bozuk')}
 return{d,dek,u};
}
function oturumKur(env,r){
 ENV=env;DEK=r.dek;db=Object.assign(DEF(),r.d);if(!Array.isArray(db.kullanicilar))db.kullanicilar=[];
 let k=db.kullanicilar.find(x=>x.k===r.u);
 if(!k){k={k:r.u,ad:r.u,rol:db.kullanicilar.some(x=>x.rol==='yonetici')?'kullanici':'yonetici',tarih:today()};db.kullanicilar.push(k)}
 OTURUM={k:r.u,ad:k.ad,rol:k.rol};
 let dd=yilDoldur();db.hareketler.forEach(h=>{if(h.bag&&typeof h.aciklama==='string'&&h.aciklama.startsWith('Kartı ')&&h.aciklama.includes(' firmasına çekildi')){h.aciklama=h.aciklama.slice(6);dd=true}});
 if(dd)save();
}
const yonetici=()=>!!OTURUM&&OTURUM.rol==='yonetici';
async function kalici(){
 if(!DEK||!ENV)return false;
 const e=await veriSifrele(db,DEK);ENV.iv=e.iv;ENV.d=e.d;
 try{localStorage.setItem(KEY2,JSON.stringify(ENV));return true}catch(x){
  if(!uyari){uyari=true;setTimeout(()=>toast('⚠️ Tarayıcı kalıcı kayda izin vermiyor. Veriler yalnızca bu sayfa açıkken durur; Chrome\'da açın ve yedek alın.',6000),300)}
  return false}
}

async function girisYap(){

 try{const r=await zarfAc(env,ad,pw);yanlis=0;oturumKur(env,r);oturumAc()}
 catch(e){
  if(e.message==='bozuk')return girisHata('Kayıtlı veri bozuk görünüyor. Bir yedek dosyası yükleyin.');
  yanlis++;if(yanlis>=5){kilitBit=Date.now()+30000*Math.min(8,yanlis-4)}
  const g=$('#g_s1');if(g)g.value='';

function girisDosya(i){

/* ---------- Kaydet / Yükle ---------- */
const BKEY='muhasebe_pro_son_yedek',PKEY='muhasebe_pro_onceki';
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function veriVarMi(){return db.cariler.length||db.hareketler.length||db.cekler.length||db.kasa.length||db.teklifler.length||db.notlar.length}

function yedekUyari(){

 return `<div class="card stat warn" style="margin-bottom:12px"><small>⚠️ Yedek almanız önerilir</small><b style="font-size:15px;display:block;margin-bottom:8px">${s?'Son yedek '+gun+' gün önce alındı.':'Henüz yedek dosyası kaydetmediniz.'}</b><small style="margin-bottom:10px">Veriler bu cihazın tarayıcısında durur. Tarayıcı verileri silinirse kaybolur.</small><button class="btn sm" onclick="farkliKaydet()">💾 Şimdi Kaydet</button></div>`;
}
async function dosyaKaydet(data,ad){
 const uz=(ad.split('.').pop()||'json').toLowerCase();
 if(window.showSaveFilePicker){
  try{
   const h=await window.showSaveFilePicker({suggestedName:ad,types:[{description:uz.toUpperCase()+' dosyası',accept:uz==='html'?{'text/html':['.html']}:uz==='pdf'?{'application/pdf':['.pdf']}:uz==='xlsx'?{'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':['.xlsx']}:{'application/json':['.json']}}]});
   const w=await h.createWritable();await w.write(data);await w.close();return 'ok';
  }catch(e){if(e&&e.name==='AbortError')return 'iptal'}
 }
 let d=null;try{if(window.claude&&claude.use)d=await claude.use('downloads')}catch(e){}
 if(d){try{await d.save({filename:ad,data});return 'ok'}catch(e){return e&&e.code==='declined'?'iptal':'hata'}}
 try{const b=new Blob([data],{type:'application/octet-stream'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=ad;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},3000);return 'ok'}catch(e){return 'hata'}
}

 if(r==='ok'){lsSet(BKEY,new Date().toISOString());dirty=false;toast('Yedek dosyası kaydedildi: '+ad,4500);if(ROUTE==='panel'||ROUTE==='ayarlar')render()}

 else{toast('Dosya kaydedilemedi. Yedeği metin olarak kopyalayabilirsiniz.',4500);metinGoster()}
}

 const icerik=await zarfMetni(),basari=()=>{lsSet(BKEY,new Date().toISOString());dirty=false;if(ROUTE==='panel'||ROUTE==='ayarlar')render()};

   await navigator.share({files:[f],title:'Sanilift Muhasebe yedek '+fd(today()),text:'Muhasebe yedek dosyası ektedir.'+(adr?'\nGönderilecek adres: '+adr:'')});
   basari();toast(adr?'Paylaşım tamamlandı. Adres panoya kopyalandı, e-postada alıcıya yapıştırın':'Paylaşım tamamlandı',6000);return;
  }
 }catch(e){if(e&&e.name==='AbortError'){toast('Gönderme iptal edildi');return}}
 /* paylaşım desteklenmiyorsa: dosyayı kaydet, e-posta uygulamasını aç */

 if(r!=='ok'){toast(r==='iptal'?'Kaydetme iptal edildi':'⚠️ Dosya kaydedilemedi',4500);return}
 basari();

 document.body.appendChild(a);a.click();a.remove();
 toast('Dosya kaydedildi. Açılan e-postaya "'+ad+'" dosyasını ek olarak ekleyin',8000);

function yedekCoz(txt){
 let d=JSON.parse(txt);
 for(let i=0;i<3;i++){if(d&&d.veri&&!d.cariler)d=d.veri}
 if(!d||!['cariler','hareketler','cekler','kasa','teklifler'].every(k=>Array.isArray(d[k])))throw new Error('gecersiz');
 return Object.assign(DEF(),d);
}

  await yazSira;lsSet(PKEY,lsGet(KEY2)||'');
  oturumKur(env,r);await save();dirty=false;bostaSifirla();toast('Veriler yüklendi ✓ Hesaplar dosyadakilerle değişti',5000);return null;
 },'"'+ad+'" şifreli bir yedek. Bu cihazdaki mevcut veriler ve kullanıcı hesapları dosyadakilerle DEĞİŞTİRİLİR. Yüklemeyi sonradan geri alabilirsiniz.');

async function yukleIsle(txt,ad){
 if(!yonetici()){toast('Yedek yükleme yalnızca yöneticiler içindir',4000);return}
 let j=null;try{j=JSON.parse(txt)}catch(e){}

/* Küçük PDF yazıcı: TrueType yazı tipi gömülür (Türkçe karakterler ve ₺ desteklenir), harici kütüphane gerekmez. */
const PT=72/25.4;
function b64bytes(b){const s=atob(b),a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a}
function ttfOku(bytes){
 const dv=new DataView(bytes.buffer,bytes.byteOffset,bytes.byteLength);
 const n=dv.getUint16(4),T={};
 for(let i=0;i<n;i++){const o=12+i*16;const tag=String.fromCharCode(dv.getUint8(o),dv.getUint8(o+1),dv.getUint8(o+2),dv.getUint8(o+3));T[tag]={off:dv.getUint32(o+8),len:dv.getUint32(o+12)}}
 const head=T.head.off,hhea=T.hhea.off,upm=dv.getUint16(head+18);
 const bbox=[dv.getInt16(head+36),dv.getInt16(head+38),dv.getInt16(head+40),dv.getInt16(head+42)].map(v=>Math.round(v*1000/upm));
 const asc=Math.round(dv.getInt16(hhea+4)*1000/upm),desc=Math.round(dv.getInt16(hhea+6)*1000/upm),nh=dv.getUint16(hhea+34);
 let c4=-1;const cm=T.cmap.off,nt=dv.getUint16(cm+2);
 for(let i=0;i<nt;i++){const pid=dv.getUint16(cm+4+i*8),eid=dv.getUint16(cm+6+i*8),off=dv.getUint32(cm+8+i*8);
  if(dv.getUint16(cm+off)===4&&((pid===3&&eid===1)||pid===0)){c4=cm+off;if(pid===3)break}}
 if(c4<0)throw new Error('Yazı tipi okunamadı');
 const segX2=dv.getUint16(c4+6),sc=segX2/2,endO=c4+14,startO=endO+segX2+2,deltaO=startO+segX2,rangeO=deltaO+segX2;
 function gid(code){
  for(let i=0;i<sc;i++){
   if(code<=dv.getUint16(endO+i*2)){
    const start=dv.getUint16(startO+i*2);if(code<start)return 0;
    const delta=dv.getInt16(deltaO+i*2),ro=dv.getUint16(rangeO+i*2);
    if(ro===0)return (code+delta)&0xFFFF;
    const g=dv.getUint16(rangeO+i*2+ro+(code-start)*2);return g===0?0:(g+delta)&0xFFFF;
   }
  }
  return 0;
 }
 const hm=T.hmtx.off;
 function adv(g){const k=g<nh?g:nh-1;return Math.round(dv.getUint16(hm+k*4)*1000/upm)}
 return{bbox,asc,desc,gid,adv};
}
function Yazi(bytes){this.f=ttfOku(bytes);this.bytes=bytes;this.kul=new Map();this.soru=this.f.gid(63)}
Yazi.prototype.g=function(ch){let cp=ch.codePointAt(0),g=this.f.gid(cp);if(!g){cp=63;g=this.soru}return[g,cp]};
Yazi.prototype.pt=function(s,size){let w=0;for(const ch of s)w+=this.f.adv(this.g(ch)[0]);return w*size/1000};
Yazi.prototype.hex=function(s){let h='';for(const ch of s){const gc=this.g(ch);this.kul.set(gc[0],gc[1]);h+=gc[0].toString(16).padStart(4,'0')}return '<'+h+'>'};

async function zlibSik(u8){

 try{const st=new Blob([u8]).stream().pipeThrough(new CompressionStream('deflate'));return{d:new Uint8Array(await new Response(st).arrayBuffer()),z:true}}catch(e){return{d:u8,z:false}}
}
function logoHazirla(){

  const w=im.naturalWidth,h=im.naturalHeight,cv=document.createElement('canvas');cv.width=w;cv.height=h;
  const cx=cv.getContext('2d');cx.drawImage(im,0,0);const px=cx.getImageData(0,0,w,h).data;
  const rgb=new Uint8Array(w*h*3),al=new Uint8Array(w*h);

  const a=await zlibSik(rgb),b=await zlibSik(al);

function pdfYazici(R,B,LG){
 const W=595.28,H=841.89,F={R:R,B:B},sayfalar=[];let ak=null,kullanildi=false;
 const q=v=>(Math.round(v*100)/100).toString();
 const rg=c=>c.map(v=>(v/255).toFixed(3)).join(' ');
 const enc=new TextEncoder();
 const P={
  yeni(){ak=[];sayfalar.push(ak)},
  sayfa(i){ak=sayfalar[i]},
  adet(){return sayfalar.length},
  olc(s,f,b){return F[f].pt(String(s),b)/PT},
  yaz(x,y,s,o){o=o||{};const f=o.f||'R',b=o.boyut||9;s=String(s==null?'':s);if(!s)return;
   const w=F[f].pt(s,b);let px=x*PT;if(o.hiza==='sag')px-=w;else if(o.hiza==='orta')px-=w/2;
   ak.push('BT /'+f+' '+q(b)+' Tf '+rg(o.renk||[17,17,17])+' rg '+q(px)+' '+q(H-y*PT)+' Td '+F[f].hex(s)+' Tj ET')},
  resim(x,y,w,h){if(!LG)return;kullanildi=true;ak.push('q '+q(w*PT)+' 0 0 '+q(h*PT)+' '+q(x*PT)+' '+q(H-(y+h)*PT)+' cm /Im1 Do Q')},
  kutu(x,y,w,h,c){ak.push(rg(c)+' rg '+q(x*PT)+' '+q(H-(y+h)*PT)+' '+q(w*PT)+' '+q(h*PT)+' re f')},
  cizgi(x1,y1,x2,y2,c,k){ak.push(rg(c||[200,200,200])+' RG '+q((k||0.2)*PT)+' w '+q(x1*PT)+' '+q(H-y1*PT)+' m '+q(x2*PT)+' '+q(H-y2*PT)+' l S')},
  sar(s,f,b,gen){
   const out=[];
   const parca=w=>{let part='';for(const ch of w){if(part&&P.olc(part+ch,f,b)>gen){out.push(part);part=ch}else part+=ch}return part};
   for(const para of String(s).split('\n')){
    let cur='';
    for(const w of para.split(' ')){
     const t=cur?cur+' '+w:w;
     if(P.olc(t,f,b)<=gen){cur=t;continue}
     if(cur)out.push(cur);
     cur=P.olc(w,f,b)<=gen?w:parca(w);
    }
    out.push(cur);
   }
   return out;
  },
  bitir(baslik){
   const parcalar=[],ofs=[];let konum=0;
   const ekle=u=>{parcalar.push(u);konum+=u.length};
   const nesne=(id,dict,stream)=>{
    ofs[id]=konum;
    if(stream){ekle(enc.encode(id+' 0 obj\n'+dict+'\nstream\n'));ekle(stream);ekle(enc.encode('\nendstream\nendobj\n'))}
    else ekle(enc.encode(id+' 0 obj\n'+dict+'\nendobj\n'));
   };
   ekle(enc.encode('%PDF-1.4\n'));ekle(Uint8Array.from([0x25,0xE2,0xE3,0xCF,0xD3,0x0A]));
   const N=sayfalar.length,ilk=14;
   nesne(1,'<< /Type /Catalog /Pages 2 0 R >>');
   nesne(2,'<< /Type /Pages /Kids ['+sayfalar.map((_,i)=>(ilk+2*i)+' 0 R').join(' ')+'] /Count '+N+' >>');
   const yaziNesneleri=(key,ad,base,stemV)=>{
    const Fo=F[key],f=Fo.f,ff=base,fdsc=base+1,cid=base+2,tu=base+3,t0=base+4;
    nesne(ff,'<< /Length '+Fo.bytes.length+' /Length1 '+Fo.bytes.length+' >>',Fo.bytes);
    nesne(fdsc,'<< /Type /FontDescriptor /FontName /'+ad+' /Flags 32 /FontBBox ['+f.bbox.join(' ')+'] /ItalicAngle 0 /Ascent '+f.asc+' /Descent '+f.desc+' /CapHeight 729 /StemV '+stemV+' /FontFile2 '+ff+' 0 R >>');
    let Wd='';Fo.kul.forEach((cp,g)=>{Wd+=g+' ['+f.adv(g)+'] '});
    nesne(cid,'<< /Type /Font /Subtype /CIDFontType2 /BaseFont /'+ad+' /CIDSystemInfo << /Registry (Adobe) /Ordering (Identity) /Supplement 0 >> /FontDescriptor '+fdsc+' 0 R /DW 600 /W ['+Wd+'] /CIDToGIDMap /Identity >>');
    const ent=Array.from(Fo.kul.entries());let bf='';
    for(let i=0;i<ent.length;i+=100){const ch=ent.slice(i,i+100);bf+=ch.length+' beginbfchar\n'+ch.map(e=>'<'+e[0].toString(16).padStart(4,'0')+'> <'+e[1].toString(16).padStart(4,'0')+'>').join('\n')+'\nendbfchar\n'}
    const u=enc.encode('/CIDInit /ProcSet findresource begin\n12 dict begin\nbegincmap\n/CIDSystemInfo << /Registry (Adobe) /Ordering (UCS) /Supplement 0 >> def\n/CMapName /Adobe-Identity-UCS def\n/CMapType 2 def\n1 begincodespacerange\n<0000> <FFFF>\nendcodespacerange\n'+bf+'endcmap\nCMapName currentdict /CMap defineresource pop\nend\nend');
    nesne(tu,'<< /Length '+u.length+' >>',u);
    nesne(t0,'<< /Type /Font /Subtype /Type0 /BaseFont /'+ad+' /Encoding /Identity-H /DescendantFonts ['+cid+' 0 R] /ToUnicode '+tu+' 0 R >>');
   };
   yaziNesneleri('R','DejaVuSans',3,80);
   yaziNesneleri('B','DejaVuSans-Bold',8,140);
   let tb='FEFF';for(let i=0;i<baslik.length;i++)tb+=baslik.charCodeAt(i).toString(16).padStart(4,'0');
   nesne(13,'<< /Title <'+tb+'> /Producer (Sanilift Muhasebe) /CreationDate (D:'+new Date().toISOString().replace(/[-:T]/g,'').slice(0,14)+'Z) >>');
   const imA=ilk+2*N,imB=imA+1,xo=kullanildi?' /XObject << /Im1 '+imA+' 0 R >>':'';
   sayfalar.forEach((a,i)=>{
    const pid=ilk+2*i,cid=pid+1,veri=enc.encode(a.join('\n'));
    nesne(pid,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+W+' '+H+'] /Resources << /Font << /R 7 0 R /B 12 0 R >>'+xo+' >> /Contents '+cid+' 0 R >>');
    nesne(cid,'<< /Length '+veri.length+' >>',veri);
   });
   if(kullanildi){
    const fl=LG.z?' /Filter /FlateDecode':'';
    nesne(imA,'<< /Type /XObject /Subtype /Image /Width '+LG.w+' /Height '+LG.h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /SMask '+imB+' 0 R'+fl+' /Length '+LG.rgb.length+' >>',LG.rgb);
    nesne(imB,'<< /Type /XObject /Subtype /Image /Width '+LG.w+' /Height '+LG.h+' /ColorSpace /DeviceGray /BitsPerComponent 8'+fl+' /Length '+LG.al.length+' >>',LG.al);
   }
   const son=ilk+2*N-1+(kullanildi?2:0),xr=konum;
   let x='xref\n0 '+(son+1)+'\n0000000000 65535 f \n';
   for(let i=1;i<=son;i++)x+=String(ofs[i]).padStart(10,'0')+' 00000 n \n';
   ekle(enc.encode(x+'trailer\n<< /Size '+(son+1)+' /Root 1 0 R /Info 13 0 R >>\nstartxref\n'+xr+'\n%%EOF'));

  }

const XLSX_MIME='application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
const AY_TR=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const _crcT=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=_crcT[(c^b[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0}
function zipYaz(dosyalar){
 const enc=new TextEncoder(),parts=[],cen=[];let off=0;
 const u16=v=>[v&255,(v>>8)&255],u32=v=>[v&255,(v>>8)&255,(v>>16)&255,(v>>24)&255];
 dosyalar.forEach(([ad,icerik])=>{
  const nb=enc.encode(ad),d=typeof icerik==='string'?enc.encode(icerik):icerik,crc=crc32(d);
  const lh=new Uint8Array([0x50,0x4b,3,4,...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(d.length),...u32(d.length),...u16(nb.length),...u16(0)]);
  parts.push(lh,nb,d);
  cen.push(new Uint8Array([0x50,0x4b,1,2,...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(d.length),...u32(d.length),...u16(nb.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),nb);
  off+=lh.length+nb.length+d.length;
 });
 let cs=0;cen.forEach(x=>cs+=x.length);
 const end=new Uint8Array([0x50,0x4b,5,6,...u16(0),...u16(0),...u16(dosyalar.length),...u16(dosyalar.length),...u32(cs),...u32(off),...u16(0)]);
 return new Blob([...parts,...cen,end],{type:XLSX_MIME});

function kdvAylik(){

  if(h.tip!=='satis'&&h.tip!=='alis')return;

  const top=tot(h),oran=+h.kdv||0,matrah=h.tutar!=null?top/(1+oran/100):(+h.adet||0)*(+h.birim||0),kdv=top-matrah;
  const m=M[t]||(M[t]={ay:t,smat:0,skdv:0,amat:0,akdv:0});
  if(h.tip==='satis'){m.smat+=matrah;m.skdv+=kdv}else{m.amat+=matrah;m.akdv+=kdv}
 });
 let dev=0;
 return Object.keys(M).sort().map(k=>{
  const m=M[k];['smat','skdv','amat','akdv'].forEach(x=>m[x]=yuvarla(m[x]));
  const fark=yuvarla(m.skdv-m.akdv-dev);m.oncekiDevir=dev;

 });
}

 });

function yaslandir(id){

 db.hareketler.filter(h=>h.cariId===id).forEach(h=>{const t=tot(h);
  if(h.tip==='satis'||(h.tip==='devira'&&h.yon!=='verecek'))it.push({t:h.tarih,k:t});

 db.cekler.filter(c=>c.cariId===id&&c.durum!=='odenmedi'&&c.yon==='alacak').forEach(c=>kr+=c.tutar);
 it.sort((a,b)=>String(a.t).localeCompare(String(b.t)));
 const kal=[];for(const x of it){const d=Math.min(kr,x.k);kr-=d;const r=yuvarla(x.k-d);if(r>0.004)kal.push({t:x.t,k:r})}

}

let araQ='',_araSon=[],araAcik={};
function aramaKutusu(){
 return `<div class="card" style="margin-bottom:14px"><div class="row" style="flex-wrap:nowrap"><input id="ara_q" type="search" enterkeyhint="search" autocomplete="off" placeholder="🔍 Ara: firma, çek no, tutar, fatura, kişi, not…" value="${esc(araQ)}" oninput="araQ=this.value;araAcik={};aramaCiz()" style="flex:1"><button class="btn ghost sm" id="ara_x" onclick="araQ='';araAcik={};$('#ara_q').value='';aramaCiz();$('#ara_q').focus()" style="${araQ?'':'display:none'}">✕</button></div><div id="ara_s">${aramaSonuc()}</div></div>`;
}
function aramaCiz(){const e=$('#ara_s');if(e)e.innerHTML=aramaSonuc();const x=$('#ara_x');if(x)x.style.display=araQ?'':'none'}
function aramaSonuc(){
 const toks=aNorm(araQ).replace(/₺/g,' ').split(/\s+/).filter(Boolean);
 _araSon=[];
 if(!toks.length)return '';
 if(toks.join('').length<2)return '<p style="color:var(--mut);font-size:13px;margin-top:10px">En az 2 karakter yazın.</p>';
 const bul=aramaIndeks().filter(it=>{const m=aNorm(it.metin);return toks.every(k=>m.includes(k))});
 if(!bul.length)return '<p style="color:var(--mut);font-size:13px;margin-top:10px">Eşleşen kayıt bulunamadı.</p>';
 let h='<p style="color:var(--mut);font-size:12px;margin-top:10px">'+bul.length+' kayıt bulundu</p>';
 ARA_GRUP.forEach(([g,ik,ad])=>{
  const L=bul.filter(x=>x.g===g);if(!L.length)return;
  if(g==='cari')L.sort((a,b)=>(aNorm(b.baslik).startsWith(toks[0])?1:0)-(aNorm(a.baslik).startsWith(toks[0])?1:0)||a.baslik.localeCompare(b.baslik,'tr'));
  else L.sort((a,b)=>String(b.tarih).localeCompare(String(a.tarih)));
  const lim=araAcik[g]?L.length:6,goster=L.slice(0,lim);
  h+='<div class="ara-g"><h4><span>'+ik+' '+ad+' ('+L.length+')</span>'+(L.length>6?'<button class="btn ghost sm" onclick="araAcik[\''+g+'\']='+(!araAcik[g])+';aramaCiz()">'+(araAcik[g]?'Daralt':'Tümünü göster')+'</button>':'')+'</h4>';
  goster.forEach(x=>{const i=_araSon.push(x)-1;
   h+='<div class="ara-r" onclick="aramaGit('+i+')"><div style="min-width:0"><b>'+hl(x.baslik,toks)+'</b>'+(x.alt?'<small>'+hl(x.alt,toks)+'</small>':'')+'</div>'+(x.tutar==null?'':'<span class="ara-t '+x.renk+'">'+fmt(x.tutar)+'</span>')+'</div>';
  });
  h+='</div>';
 });
 return h;
}
function aramaGit(i){const x=_araSon[i];if(x)x.git()}

 const cariler=db.cariler.filter(x=>x.id!==c.cariId).sort((a,b)=>a.ad.localeCompare(b.ad,'tr')).map(x=>[x.id,cariEtiket(x)]);
 if(!cariler.length){toast('Ciro edilecek başka bir cari yok. Önce firmayı cari olarak ekleyin.',4500);return}
 const a=db.cariler.find(x=>x.id===c.cariId);
 form('🔁 '+(c.tur==='cek'?'Çek':'Senet')+' Ciro Et',[
  {name:'b',label:'Kime verildi? (ödeme yapılan firma)',type:'select',value:'',options:[['','— Seçin —'],...cariler]},

 ],o=>{

  db.hareketler.push({id:hid,cariId:o.b,tip:'odeme',tutar:c.tutar,tarih:o.tarih,ciro:c.id,kaynak:c.cariId,aciklama:(c.tur==='cek'?'Çek':'Senet')+' ödemesi · No: '+c.no+(o.aciklama?' · '+o.aciklama:'')});

  save();setTimeout(()=>toast('Ciro işlendi: '+cb.ad+' carisinden '+fmt(c.tutar)+' düşüldü ✓',5000),80);
 },{prev:()=>`<span>${esc((c.tur==='cek'?'Çek':'Senet'))} No <b>${esc(c.no)}</b> · <b class="green">${fmt(c.tutar)}</b>${a?' · '+esc(a.ad)+' carisinden alınan':''}</span><br><small style="color:var(--mut)">Seçtiğiniz firmanın carisinden bu tutar düşer${a?'; '+esc(a.ad)+' carisi de bu çekle kapanır':''}. Hazineye nakit girişi/çıkışı işlenmez.</small>`});

 });

 });

async function teklifPdf(t){
 if(!window.__FR||!window.__FB)throw new Error('Yazı tipi yüklenemedi');
 const LG=await logoHazirla();
 const P=pdfYazici(new Yazi(b64bytes(window.__FR)),new Yazi(b64bytes(window.__FB)),LG);
 const L=12,Rr=198,DARK=[17,17,17],MUT=[110,110,110],OR=[255,122,0],YEL=[255,196,0];
 const firma=db.ayar.firma||'Firma Adınız',T=tkTop(t),dahil=!!t.dahil;
 const sy=v=>String(v).replace('.',',');
 let y=0;
 function sayfaBasla(ilk){
  P.yeni();P.kutu(0,0,210,3,OR);
  if(!ilk){P.yaz(L,12,firma+'  ·  Teklif '+t.no,{boyut:8,renk:MUT});y=18;return}
  let fy=15,ty=20;
  if(LG){const lw=42,lh=lw*LG.h/LG.w;P.resim(L,7,lw,lh);fy=7+lh+6.5;ty=fy+5}
  P.yaz(L,fy,firma,{f:'B',boyut:LG?12:15});
  let yy=ty;firmaSatirlari().forEach(x=>P.sar(x,'R',8.5,90).forEach(l=>{P.yaz(L,yy,l,{boyut:8.5,renk:MUT});yy+=4.2}));
  P.yaz(Rr,15,'TEKLİF',{f:'B',boyut:16,hiza:'sag',renk:OR});
  P.yaz(Rr,21,'No: '+t.no,{boyut:8.5,renk:MUT,hiza:'sag'});
  P.yaz(Rr,25.5,'Tarih: '+fd(t.tarih),{boyut:8.5,renk:MUT,hiza:'sag'});
  if(t.gecerlilik)P.yaz(Rr,30,'Geçerlilik: '+fd(t.gecerlilik),{boyut:8.5,renk:MUT,hiza:'sag'});
  y=Math.max(yy,34)+2;P.cizgi(L,y,Rr,y,[220,220,220],0.3);y+=5;
  const sat=musteriSatirlari(t).flatMap(l=>P.sar(l,'R',8.5,Rr-L-10));
  const adL=P.sar(t.musteri||'—','B',12,Rr-L-10),h=11+adL.length*5.4+sat.length*4.4;
  P.kutu(L,y,Rr-L,h,[246,246,246]);P.kutu(L,y,1.2,h,OR);
  P.yaz(L+5,y+4.6,'SAYIN',{boyut:7,renk:MUT});
  adL.forEach((l,i)=>P.yaz(L+5,y+10+i*5.4,l,{f:'B',boyut:12}));
  sat.forEach((l,i)=>P.yaz(L+5,y+10+adL.length*5.4+1+i*4.4,l,{boyut:8.5,renk:[60,60,60]}));
  y+=h+7;
 }
 function tabloBasi(){
  P.kutu(L,y,Rr-L,7,DARK);const ty=y+4.8,o={f:'B',boyut:8,renk:YEL};
  P.yaz(13.5,ty,'#',o);P.yaz(22,ty,'Ürün / Hizmet',o);P.yaz(118,ty,'Adet',Object.assign({hiza:'sag'},o));
  P.yaz(156,ty,dahil?'Birim (KDV dahil)':'Birim Fiyat (₺)',Object.assign({hiza:'sag'},o));P.yaz(196.5,ty,dahil?'Tutar (KDV dahil)':'Tutar (₺)',Object.assign({hiza:'sag'},o));
  y+=7;
 }
 sayfaBasla(true);tabloBasi();
 t.items.forEach((it,n)=>{
  const dl=P.sar(it.ad||'-','R',8.5,88),hh=dl.length*4.1+3.4;
  if(y+hh>262){sayfaBasla(false);tabloBasi()}
  if(n%2)P.kutu(L,y,Rr-L,hh,[250,250,250]);
  const ty=y+4.2;
  P.yaz(13.5,ty,String(n+1),{boyut:8.5});dl.forEach((l,i)=>P.yaz(22,ty+i*4.1,l,{boyut:8.5}));
  P.yaz(118,ty,sy(it.adet),{boyut:8.5,hiza:'sag'});P.yaz(156,ty,pn(it.birim),{boyut:8.5,hiza:'sag'});P.yaz(196.5,ty,pn(it.adet*it.birim),{f:'B',boyut:8.5,hiza:'sag'});
  y+=hh;P.cizgi(L,y,Rr,y,[232,232,232],0.15);
 });
 const not=t.not?t.not.split('\n').flatMap(l=>P.sar(l,'R',8.5,Rr-L)):[];
 if(y+40+not.length*4>272)sayfaBasla(false);
 y+=6;const bx=118;let yy=y;
 [[dahil?'Ara Toplam (KDV hariç)':'Ara Toplam',pn(T.a)+' ₺'],['KDV (%'+sy(t.kdv)+')',pn(T.k)+' ₺']].forEach(a=>{P.yaz(bx,yy+4,a[0],{boyut:8.5,renk:MUT});P.yaz(Rr-1.5,yy+4,a[1],{boyut:8.5,hiza:'sag'});yy+=5.2});
 P.cizgi(bx,yy+0.8,Rr,yy+0.8,DARK,0.4);yy+=2.5;
 P.kutu(bx,yy,Rr-bx,9.5,[255,243,222]);P.yaz(bx+2,yy+6.5,'GENEL TOPLAM',{f:'B',boyut:9.5});P.yaz(Rr-2,yy+6.5,pn(T.g)+' ₺',{f:'B',boyut:11,hiza:'sag'});
 yy+=16;
 not.forEach(l=>{P.yaz(L,yy,l,{boyut:8.5,renk:[80,80,80]});yy+=4.2});
 const n=P.adet();
 for(let i=0;i<n;i++){P.sayfa(i);P.cizgi(L,284,Rr,284,[220,220,220],0.2);
  P.yaz(L,289,firma+'  ·  Teklif '+t.no,{boyut:7.5,renk:MUT});P.yaz(Rr,289,'Sayfa '+(i+1)+' / '+n,{boyut:7.5,renk:MUT,hiza:'sag'});}
 return P.bitir('Teklif '+t.no);
}
async function tkPdfGonder(t){

 try{
  const blob=await teklifPdf(t),ad='teklif-'+String(t.no||'yeni').replace(/[^A-Za-z0-9._-]+/g,'-')+'.pdf';
  const r=await dosyaKaydet(blob,ad);
  if(r==='ok')toast('Teklif PDF kaydedildi: '+ad+'. WhatsApp veya e-posta ile gönderebilirsiniz.',6000);
  else if(r==='iptal')toast('Kaydetme iptal edildi');
  else toast('⚠️ PDF kaydedilemedi. Sayfayı Chrome tarayıcısında açmayı deneyin.',5000);
 }catch(e){toast('PDF oluşturulamadı: '+(e&&e.message||e),5000)}
}
